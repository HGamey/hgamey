name: node-tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  protocol:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s node/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check node/dash_static/jobs.js
