name: node-tests
on:
  push:
    branches: [main, 'verify/**']
  pull_request:
jobs:
  protocol:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s node/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          for script in node/dash_static/*.js; do
            node --check "$script"
          done
  cgroup-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Real cgroup v2 privilege and lifecycle contract
        run: |
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 \
            timeout --signal=TERM --kill-after=10s 90s /usr/bin/python3 \
            node/tests/integration_job_cgroup.py \
            --artifact-dir "$RUNNER_TEMP/job-cgroup-kernel"
      - name: Non-root node through installed privileged entry
        id: privileged
        run: |
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 \
            timeout --signal=TERM --kill-after=10s 90s /usr/bin/python3 \
            node/tests/integration_job_privileged.py \
            --artifact-dir "$RUNNER_TEMP/job-privileged-worker"
      - name: Lost worker domain reconciliation and output handback
        id: reconcile
        run: |
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 \
            timeout --signal=TERM --kill-after=10s 120s /usr/bin/python3 \
            node/tests/integration_job_reconcile.py \
            --artifact-dir "$RUNNER_TEMP/job-execution-reconcile"
      - name: Preserve kernel observations and raw worker files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-cgroup-kernel-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/job-cgroup-kernel
          if-no-files-found: error
          retention-days: 14
      - name: Preserve privileged entry and cross-identity observations
        if: always() && steps.privileged.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: job-privileged-worker-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/job-privileged-worker
          if-no-files-found: error
          retention-days: 14
      - name: Preserve lost worker and reconciliation observations
        if: always() && steps.reconcile.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: job-execution-reconcile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/job-execution-reconcile
          if-no-files-found: error
          retention-days: 14
  pf-shared-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: HGamey/phonefarm
          ref: baef293bb69d10da6ce528421608a43cfd5a4cc5
          path: pf-runtime
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /tools/
            /loop_v1/tools/
            /loop_v1/auto/sample_env.sh
            /loop_v1/carriers/vulkan-samples/rules.json
            /loop_v1/refbench/rules.json
            /knobs/gray/build/layer_build.json
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pf-runtime/src
          key: pf-shared-control
      - name: Build the actual PF used by both identities
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: |
          if [ ! -x /bin/zsh ]; then
            sudo apt-get update -qq
            sudo apt-get install -y zsh
          fi
          cargo build --locked --manifest-path pf-runtime/src/Cargo.toml --bin phonefarm
      - name: PF shared session through fixed privileged worker
        id: shared
        run: |
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 \
            timeout --signal=TERM --kill-after=10s 150s /usr/bin/python3 \
            node/tests/integration_pf_shared.py \
            --phonefarm "$PWD/pf-runtime/src/target/debug/phonefarm" \
            --devlock-bin "$PWD/pf-runtime/tools/devlock" \
            --artifact-dir "$RUNNER_TEMP/pf-shared-control"
      - name: Preserve actual PF session and transport observations
        if: always() && steps.shared.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: pf-shared-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pf-shared-control
          if-no-files-found: error
          retention-days: 14
      - name: Failed battery session and asynchronous typed recovery
        id: recovery
        run: |
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 \
            timeout --signal=TERM --kill-after=10s 180s /usr/bin/python3 \
            node/tests/integration_pf_recovery.py \
            --phonefarm "$PWD/pf-runtime/src/target/debug/phonefarm" \
            --devlock-bin "$PWD/pf-runtime/tools/devlock" \
            --artifact-dir "$RUNNER_TEMP/pf-session-recovery"
      - name: Preserve failed source and recovery evidence
        if: always() && steps.recovery.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: pf-session-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pf-session-recovery
          if-no-files-found: error
          retention-days: 14
