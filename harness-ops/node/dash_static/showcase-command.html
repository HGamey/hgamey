<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>HGamey</title>
<link rel="stylesheet" href="/dash/static/showcase-command.css">
</head>
<body>
<div id="viewport"><div id="world"><div id="grid"></div><svg id="links"></svg></div></div>
<div class="veil top"></div><div class="veil bottom"></div>
<div id="agents"></div>

<aside class="rail">
  <div class="brand"><span class="mark">HG</span>HGamey<span class="live"><i></i>回放</span></div>
  <div class="clock"><b id="clock">--:--</b><span id="date"></span><small id="source"></small></div>
  <section><h4>Agent<span id="agents-n"></span></h4><div id="roster"></div></section>
  <section class="feed" id="feed"></section>
</aside>

<div class="hud counts" id="counts"></div>
<div class="hud toggles">
  <button type="button" id="t-wins" aria-pressed="false">成果</button>
  <button type="button" id="t-trend" aria-pressed="false">趋势</button>
  <button type="button" id="t-fit">全部任务</button>
  <button type="button" id="t-story">讲解</button>
</div>
<div class="hud dock" id="dock"></div>

<aside class="panel wins" id="wins" hidden></aside>
<section class="panel trend" id="trend" hidden>
  <h3>每小时实验<span class="legend"><span><i style="--c:var(--teal)"></i>成功</span><span><i style="--c:var(--ash)"></i>未成功</span><span><i style="--c:var(--ink)"></i>交付报告</span><span><i style="--c:var(--gold)"></i>人的回复</span></span></h3>
  <svg id="trend-svg" viewBox="0 0 1000 180" preserveAspectRatio="none"></svg>
  <div class="axis" id="trend-axis"></div>
</section>
<div class="toast" id="toast" hidden></div>
<div class="tip" id="tip" hidden></div>

<script type="module" src="/dash/static/showcase-command.js"></script>
</body>
</html>
