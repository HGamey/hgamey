<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>HGamey</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/dash/static/app.css">
<link rel="stylesheet" href="/dash/static/home.css">
<link rel="stylesheet" href="/dash/static/shell.css">
</head>
<body>
<header class="top">
  <div class="brand-row">
    <a class="logo" href="/dash" aria-label="首页">HG</a>
    <div class="brand"><h1>HGamey</h1></div>
    <nav class="nav" style="flex-wrap:wrap"><a href="/dash" aria-current="page">首页</a><a href="/dash/live">实时画面</a> <a href="/dash/control">远程调试</a><a href="/dash/fleet">节点与设备</a><a href="/dash/games">游戏与资源</a><a href="/dash/jobs">任务与结果</a><a href="/dash/research">研究与协助</a><a href="/dash/results">研究结果</a><a href="/dash/doctor">环境诊断</a><a href="/dash/updates">节点更新</a><a href="/dash/maint">维护</a></nav>
  </div>
  <div class="top-right">
    <span id="live" class="live"><i></i><span id="live-text">连接中</span></span>
    <button id="steer-btn" class="btn sm" type="button">操作权限</button>
    <button id="new-btn" class="btn primary" type="button">＋ 新任务</button>
    <a id="goal-btn" class="btn" href="/dash/gol">GOL 目标</a>
    <form method="post" action="/dash/logout"><button class="ghost" title="退出">退出</button></form>
  </div>
</header>
<main class="home">
  <section aria-labelledby="h-tasks"><h2 id="h-tasks" class="sec-title">任务</h2><ul id="tasks" class="tasks"></ul></section>
  <section aria-labelledby="h-phones"><h2 id="h-phones" class="sec-title">手机</h2><div id="phones" class="phones"></div><p id="phones-more" class="phones-more"></p></section>
  <section aria-labelledby="h-agents"><h2 id="h-agents" class="sec-title">Agent</h2><ul id="agents" class="tasks"></ul></section>
  <section aria-labelledby="h-questions"><h2 id="h-questions" class="sec-title">待回复问题</h2><ul id="questions" class="tasks"></ul></section>
  <section aria-labelledby="h-reports"><h2 id="h-reports" class="sec-title">已交付的报告</h2><ul id="reports" class="tasks"></ul></section>
</main>
<dialog id="dlg-unlock" class="dlg"><form id="f-unlock"><h3>输入操作密码</h3><p class="note2">新建任务需要操作密码。</p><input type="password" id="steer-pw" placeholder="操作密码" autocomplete="current-password" required><div class="row-btns"><button class="btn primary" type="submit">解锁</button><button class="btn" type="button" data-close>取消</button><span id="unlock-msg" class="msg err"></span></div></form></dialog>
<dialog id="dlg-research" class="dlg"><form id="research-form"><h3>新建任务</h3>
  <label>一句话目标<textarea id="research-objective" rows="3" maxlength="2000" required></textarea></label>
  <label>游戏（可选）<select id="research-game"><option value="">不限游戏</option><option value="com.miHoYo.Yuanshen">原神</option><option value="com.unity.megacity.metro">Megacity</option><option value="com.miHoYo.hkrpg">崩坏：星穹铁道</option><option value="com.miHoYo.Nap">绝区零</option><option value="com.tencent.tmgp.sgame">王者荣耀</option><option value="com.tencent.tmgp.pubgmhd">和平精英</option></select></label>
  <label>设备（可选）<select id="research-device"></select></label>
  <div class="row-btns"><button id="research-submit" class="btn primary" type="submit">创建任务</button><button class="btn" type="button" data-close>取消</button><span id="research-msg" class="msg"></span></div>
</form></dialog>
<script src="/dash/static/target.js"></script><script src="/dash/static/job-state.js"></script><script src="/dash/static/home.js"></script><script src="/dash/static/shell.js"></script>
</body></html>
