<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>HGamey 实时看板 · 维护</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/dash/static/app.css">
<link rel="stylesheet" href="/dash/static/shell.css">
</head>
<body>
<header class="top">
  <div class="brand-row">
    <a class="logo" href="/dash" aria-label="首页">HG</a>
    <div class="brand"><h1>HGamey 实时看板 · 维护</h1><span class="sub">30 分钟曲线与实时日志</span></div>
    <nav class="nav" style="flex-wrap:wrap"><a href="/dash">首页</a><a href="/dash/fleet">节点与设备</a><a href="/dash/games">游戏与资源</a><a href="/dash/jobs">任务与结果</a><a href="/dash/research">研究与协助</a><a href="/dash/results">研究结果</a><a href="/dash/doctor">环境诊断</a><a href="/dash/maint" aria-current="page">维护</a></nav>
  </div>
  <div class="top-right"><span id="live" class="live"><i></i><span id="live-text">连接中</span></span><form method="post" action="/dash/logout"><button class="ghost" title="退出">退出</button></form></div>
</header><script src="/dash/static/shell.js"></script>
<main class="grid">
  <section class="card phone" aria-labelledby="h-phone">
    <div class="card-h"><h2 id="h-phone">30 分钟曲线</h2><span id="probe" class="chip">—</span></div>
    <div class="spark-wrap">
      <div class="spark-h"><span>芯片温度 · 最近 30 分钟</span><span class="legend"><i class="sw held"></i>有人在用手机（测量中）</span></div>
      <svg id="spark" class="spark" viewBox="0 0 300 70" preserveAspectRatio="none" role="img" aria-label="芯片温度走势"></svg>
      <div id="spark-tip" class="tip" hidden></div>
    </div>
    <p id="phone-note" class="note"></p>
  </section>
  <section class="card log" aria-labelledby="h-log">
    <div class="card-h"><h2 id="h-log">实时日志</h2><span id="log-title" class="muted"></span><label class="follow"><input type="checkbox" id="follow" checked> 跟随</label></div>
    <pre id="log" class="logbox">读取当前任务日志</pre>
  </section>
</main>
<div id="tip" class="tip" hidden></div>
<script src="/dash/static/target.js"></script>
<script src="/dash/static/maint.js"></script>
</body>
</html>
