<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark">
<title>结构 · HGamey</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/dash/static/app.css"><link rel="stylesheet" href="/dash/static/jobs.css"><link rel="stylesheet" href="/dash/static/structure.css">
<link rel="stylesheet" href="/dash/static/shell.css">
</head>
<body class="jobs-view structure-view">
<a class="skip-link" href="#structure-heading">跳到结构图</a>
<header class="top"><div class="top-right"><button id="refresh" class="ghost" type="button">刷新</button></div></header><script src="/dash/static/shell.js"></script>
<main class="jobs-page structure-page">
  <div class="page-heading">
    <div><h1 id="structure-heading" tabindex="-1">结构</h1><p id="facts" class="st-facts"></p></div>
    <div class="st-heading-actions"><button id="archived-agents" class="ghost" type="button" hidden></button><button id="zone-edit" class="ghost" type="button" hidden>修改区域</button><button id="relayout" class="ghost" type="button" disabled>重排</button></div>
  </div>
  <form id="edit-unlock" class="st-edit-unlock" hidden><input id="edit-steer" type="password" autocomplete="current-password" placeholder="向管理员要操作口令" aria-label="操作口令"><button class="ghost" type="submit">解锁</button><span id="edit-message" class="note" role="status"></span></form>
  <p id="message" class="note" role="status" hidden></p>
  <div id="stage" class="st-stage" hidden>
    <div id="world" class="st-world" role="group" aria-label="结构图">
      <svg id="zones" class="st-layer" aria-hidden="true"></svg>
      <svg id="links" class="st-layer" aria-hidden="true"><g id="links-quiet"></g><g id="links-busy"></g></svg>
    </div>
  </div>
  <dialog id="zone-dialog" class="st-zone-dialog" aria-labelledby="zone-heading">
    <form id="zone-form" method="dialog">
      <h2 id="zone-heading">修改区域</h2>
      <fieldset id="zone-choices" class="st-zone-choices"><legend>区域</legend></fieldset>
      <div id="zone-unlock" class="st-zone-unlock" hidden>
        <label for="zone-steer">操作口令</label>
        <div class="st-zone-unlock-row"><input id="zone-steer" type="password" placeholder="向管理员要" autocomplete="current-password"><button id="zone-unlock-submit" class="ghost" type="button">解锁</button></div>
      </div>
      <p id="zone-message" class="note" role="status"></p>
      <div class="st-zone-actions"><button id="zone-cancel" class="ghost" type="button">取消</button><button id="zone-save" class="ghost primary" type="submit">保存</button></div>
    </form>
  </dialog>
</main>
<script src="/dash/static/target.js"></script><script src="/dash/static/job-state.js"></script><script src="/dash/static/phone-state.js"></script><script src="/dash/static/structure.js"></script>
</body>
</html>
