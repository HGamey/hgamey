<style>
.ap-list{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));padding:0;list-style:none}
.ap-card{border:1px solid color-mix(in srgb,currentColor 20%,transparent);border-radius:12px;padding:1rem;display:flex;flex-direction:column;gap:.5rem}
.ap-card.critical{border-color:#d33}
.ap-card img{width:100%;max-height:420px;object-fit:contain;border-radius:8px;background:#000}
.ap-tag{font-weight:600}.ap-card.critical .ap-tag{color:#d33}
.ap-actions{display:flex;gap:.5rem}.ap-actions button{flex:1;padding:.6rem;font-size:1rem}
.ap-meta{font-size:.85rem;opacity:.75;word-break:break-all}
</style>

<body class="jobs-view">
<a class="skip-link" href="#ap-heading">跳到待审批</a>
<header class="top">
  <div class="brand-row">
    <a class="logo" href="/dash" aria-label="HGamey 首页">HG</a><span class="brand-name">HGamey</span>
    <nav class="nav" aria-label="主导航"><a href="/dash">概览</a><a href="/dash/fleet">节点与设备</a><a href="/dash/games">游戏与资源</a><a href="/dash/jobs">任务与结果</a><a href="/dash/approvals" aria-current="page">待审批</a><a href="/dash/research">研究与协助</a><a href="/dash/results">研究结果</a><a href="/dash/doctor">环境诊断</a><a href="/dash/maint">维护</a></nav>

  </div>
