<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark">
<title>打开游戏 · HGamey</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/dash/static/app.css"><link rel="stylesheet" href="/dash/static/jobs.css"><link rel="stylesheet" href="/dash/static/research.css"><link rel="stylesheet" href="/dash/static/report.css">
<link rel="stylesheet" href="/dash/static/shell.css">
</head>
<body class="jobs-view research-view report-view open-view">
<a class="skip-link" href="#open-title">跳到打开游戏</a>
<header class="top"><div class="top-right"></div></header><script src="/dash/static/shell.js"></script>
<main class="jobs-page report-page open-page">
  <a id="open-back" class="back-link" href="/dash/research"><svg aria-hidden="true" viewBox="0 0 16 16" width="14" height="14"><path d="M10 3.5 5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>任务</span></a>
  <p class="report-kicker">打开游戏</p>
  <h1 id="open-title" tabindex="-1">打开游戏</h1>
  <p id="message" class="note" role="status">正在读取…</p>
  <div id="open" class="open-layout" hidden>
    <section class="open-pick" aria-labelledby="open-results-heading">
      <h2 id="open-results-heading">成果</h2>
      <p id="open-game" class="note"></p>
      <ul id="open-results" class="open-choices"></ul>
    </section>
    <section class="open-pick" aria-labelledby="open-phones-heading">
      <h2 id="open-phones-heading">手机</h2>
      <ul id="open-phones" class="open-choices"></ul>
    </section>
    <div class="open-actions">
      <button id="open-result" class="ghost primary" type="button" disabled>用这个结果打开游戏</button>
      <button id="open-original" class="ghost" type="button" disabled>打开原版</button>
      <p id="open-message" class="note" role="status"></p>
    </div>
    <ol id="open-steps" class="open-steps" aria-label="这次打开的作业"></ol>
    <div id="open-shots" class="open-shots"></div>
  </div>
</main>
<script src="/dash/static/target.js"></script><script src="/dash/static/job-state.js"></script><script src="/dash/static/research-task.js"></script><script src="/dash/static/task-outputs.js"></script><script src="/dash/static/game-open.js"></script>
</body>
</html>
